<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>短網址產生器</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f5f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 48px 20px;
        }

        main {
            width: min(100%, 640px);
            margin: 0 auto;
            padding: 32px;
            border: 1px solid #e1e6ef;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 12px 36px rgb(23 32 51 / 7%);
        }

        h1, h2 {
            margin-top: 0;
        }

        h1 {
            margin-bottom: 8px;
        }

        .note, .muted {
            color: #596579;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        form {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        input, button {
            min-height: 44px;
            border: 1px solid #cbd3df;
            border-radius: 8px;
            font: inherit;
        }

        input {
            width: 100%;
            padding: 10px 12px;
        }

        button {
            flex: 0 0 auto;
            padding: 9px 16px;
            color: #fff;
            border-color: #315bd6;
            background: #315bd6;
            cursor: pointer;
        }

        button:hover {
            background: #2449b8;
        }

        button:focus-visible, input:focus-visible, a:focus-visible {
            outline: 3px solid #9bb4ff;
            outline-offset: 2px;
        }

        #result, #history {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid #e1e6ef;
        }

        #short-url {
            margin-bottom: 10px;
        }

        #history-list {
            display: grid;
            gap: 14px;
            padding-left: 22px;
        }

        #history-list li {
            overflow-wrap: anywhere;
        }

        #history-list a {
            display: block;
            margin-bottom: 3px;
        }

        #status {
            min-height: 1.5em;
            margin-bottom: 0;
        }

        @media (max-width: 520px) {
            body {
                padding: 20px 12px;
            }

            main {
                padding: 24px 18px;
            }

            form {
                flex-direction: column;
            }
        }
    </style>
    <script src="./app.js" defer></script>
</head>
<body>
    <main>
        <h1>短網址產生器</h1>
        <p class="note">短網址與歷史紀錄只會儲存在這個本機瀏覽器中。請使用 http:// 或 https:// 網址。</p>

        <form id="shorten-form">
            <label class="visually-hidden" for="url">要縮短的網址</label>
            <input id="url" name="url" type="url" placeholder="https://example.com" autocomplete="url" required>
            <button type="submit">產生短網址</button>
        </form>

        <p id="status" role="status" aria-live="polite"></p>

        <section id="result" aria-labelledby="result-heading" hidden>
            <h2 id="result-heading">你的短網址</h2>
            <input id="short-url" type="text" readonly aria-label="產生的短網址">
            <button id="copy-btn" type="button">複製</button>
        </section>

        <section id="history" aria-labelledby="history-heading" hidden>
            <h2 id="history-heading">歷史紀錄</h2>
            <ul id="history-list"></ul>
        </section>
    </main>
</body>
</html>
